name: tests
# The editor suite (Chromium shards, picture comparison, WebKit) runs ONLY when the owner asks for it (owner, Oct 19 2026):
# by hand (Actions > tests > Run workflow) or on a pull request that carries the label `run-suite`.
# Opening, updating or marking a pull request ready does not start it. When it does not run, its jobs are skipped,
# which still satisfies the required `chromium` and `webkit` checks, so merging is never blocked by a run nobody asked for.
# The small site checks still run on pull requests that change the marketing site.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      snap:
        description: 'TEMPORARY (2.45.1): only write the scenario snapshots made in CI to branch ci/snapshots-2.45.1'
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'tools/**'
              - 'tests/**/*.spec.js'
              - 'tests/fixtures/**'
              - 'tests/__golden__/**'
              - 'tests/__snapshots__/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.js'
              - 'tsconfig.json'
            site:
              - 'site/**'
              - 'functions/**'
              - 'server/**'
              - 'tests/site-*.mjs'
              - 'tests/site-account.spec.js'
              - '.github/workflows/test.yml'
  site:
    name: site
    needs: changes
    if: ${{ always() && github.event_name == 'pull_request' && github.event.action != 'labeled' && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # the account tests use Node's built-in SQLite (Node 22 or newer)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:site
      - run: node --test tests/site-marketing-page.test.mjs
  # The Chromium suite is split in four parts that run at the same time (Playwright --shard, by test file). Each part rebuilds the app, which is quick.
  # The picture comparison with `main` is its own job. A last job called `chromium` collects them, so the required check name does not change.
  snap:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.snap }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      WB_ENV: ci
      WB_TARGET: build
      WB_PIXELS: '0'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=chromium tests/scenarios.spec.js --update-snapshots=changed --reporter=list || true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout -b ci/snapshots-2.45.1
          git add tests/__snapshots__
          git diff --cached --stat
          git commit -m "scenario snapshots made in CI" && git push origin ci/snapshots-2.45.1
  chromium-shard:
    name: chromium-shard ${{ matrix.shard }}/4
    needs: changes
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && !inputs.snap) || (needs.changes.outputs.app == 'true' && contains(github.event.pull_request.labels.*.name, 'run-suite'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      WB_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 --reporter=list,github
        env:
          WB_TARGET: build
          WB_PIXELS: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-chromium-${{ matrix.shard }}
          path: test-results
          retention-days: 3
  # draws the same projects with `main` and with this branch and compares the pictures (tests/picture-compare.spec.js);
  # `main` is built on the side, it needs no install. Only on pull requests: on pushes to main there is nothing older to compare with.
  picture-compare:
    name: picture-compare
    needs: changes
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.app == 'true' && contains(github.event.pull_request.labels.*.name, 'run-suite') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      WB_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
      - run: cd baseline-main && node tools/build.js && cd .. && npx playwright test --project=chromium tests/picture-compare.spec.js
        env:
          WB_PICTURE_TOLERANCE: '0.05'   # prints are packed in sheets whose make-up depends on timing, so their grain moves a little between runs (about 0.01 of 255 on average); a real change is far above this
          WB_TARGET: build
          WB_PIXELS: '0'
          WB_BASELINE: ${{ github.workspace }}/baseline-main/dist/wodblok.html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-picture-compare
          path: test-results
          retention-days: 3
  # The check that branch protection asks for (docs/going-live.md). Passes when every part passed, or when the app was not touched and they were skipped.
  chromium:
    name: chromium
    needs: [chromium-shard, picture-compare]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "parts: ${{ needs.chromium-shard.result }}, picture compare: ${{ needs.picture-compare.result }}"
          [ "${{ needs.chromium-shard.result }}" = "failure" ] || [ "${{ needs.chromium-shard.result }}" = "cancelled" ] && exit 1
          [ "${{ needs.picture-compare.result }}" = "failure" ] || [ "${{ needs.picture-compare.result }}" = "cancelled" ] && exit 1
          exit 0
  webkit:
    name: webkit
    needs: changes
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (needs.changes.outputs.app == 'true' && contains(github.event.pull_request.labels.*.name, 'run-suite'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=webkit --grep @smoke --reporter=list,github
        env:
          WB_TARGET: build
          WB_PIXELS: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-webkit
          path: test-results
          retention-days: 3

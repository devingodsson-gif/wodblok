name: tests
on: [push, pull_request]
jobs:
  chromium:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble   # pinned image: same Chromium as local runs
    env: { WB_ENV: ci }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test            # first CI run: add WB_UPDATE via `npm run test:update-golden` to create tests/__golden__/ci/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-chromium, path: test-results }
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-webkit, path: test-results }

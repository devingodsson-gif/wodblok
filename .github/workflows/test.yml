name: tests
on: [push, pull_request]
jobs:
  chromium:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble   # pinned image: same Chromium as local runs
    env: { WB_ENV: ci }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # The tests run on the built app. Pixel goldens are only valid on the machine that made them (tests/__golden__/sandbox), so CI checks state, SVG and behaviour (WB_PIXELS=0).
      - run: npx playwright test --project=chromium
        env: { WB_TARGET: build, WB_PIXELS: '0' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-chromium, path: test-results }
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=webkit --grep @smoke
        env: { WB_TARGET: build, WB_PIXELS: '0' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-webkit, path: test-results }

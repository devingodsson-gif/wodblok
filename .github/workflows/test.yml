name: tests
# Keep marketing-site changes on focused site checks; run the editor suite only when app code changes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'legacy/**'
              - 'tools/**'
              - 'tests/**/*.spec.js'
              - 'tests/**/*.spec.mjs'
              - 'tests/fixtures/**'
              - 'tests/__golden__/**'
              - 'tests/__snapshots__/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.js'
              - 'tsconfig.json'
            site:
              - 'site/**'
              - 'functions/api/waitlist.js'
              - 'tests/site-*.mjs'
              - '.github/workflows/test.yml'
  site:
    name: site
    needs: changes
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:site
      - run: node --test tests/site-marketing-page.test.mjs
  chromium:
    name: chromium
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      WB_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # draws the same projects with `main` and with this branch and compares the pictures pixel by pixel (tests/picture-compare.spec.js);
      # `main` is built on the side, it needs no install. Skipped on pushes to main, where there is nothing older to compare with.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
      - if: github.event_name == 'pull_request'
        run: cd baseline-main && node tools/build.js && cd .. && npx playwright test --project=chromium tests/picture-compare.spec.js
        env:
          WB_TARGET: build
          WB_PIXELS: '0'
          WB_BASELINE: ${{ github.workspace }}/baseline-main/dist/wodblok.html
      - run: npx playwright test --project=chromium
        env:
          WB_TARGET: build
          WB_PIXELS: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-chromium
          path: test-results
          retention-days: 3
  webkit:
    name: webkit
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=webkit --grep @smoke
        env:
          WB_TARGET: build
          WB_PIXELS: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-webkit
          path: test-results
          retention-days: 3
